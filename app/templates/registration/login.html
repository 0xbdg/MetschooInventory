{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="{% static 'img/metland.png' %}">
    <script src="{% static 'js/main.js' %}"></script>

    {% tailwind_css %}
</head>

<body class="m-0 bg-gray-100 dark:bg-gray-900">

<div class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow sm:p-8
                dark:bg-gray-800 dark:border-gray-700">

        <form class="space-y-6" action="{% url 'login' %}" method="POST">
            {% csrf_token %}

            <h5 class="text-xl font-medium text-center text-gray-900 dark:text-white">
                Metschoo Inventory
            </h5>

            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Your username
                </label>
                {{ form.username }}
            </div>

            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Your password
                </label>
                {{ form.password }}
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-gray-900 dark:text-gray-300">
                    <input type="checkbox" onclick="LoginPass()" class="w-4 h-4">
                    Show Password
                </label>

                <a href="{% url 'password_reset' %}" class="text-blue-700 hover:underline dark:text-blue-500">
                    Lost Password?
                </a>
            </div>

            <button type="submit"
                class="w-full text-white bg-blue-700 hover:bg-blue-800 rounded-lg text-sm px-5 py-2.5">
                Login to your account
            </button>

        </form>

    </div>

</div>

</body>
</html>
